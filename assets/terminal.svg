<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" aria-label="Terminal showing animated ASCII art of the name Sourav">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="asciiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <clipPath id="cmd1"><rect x="0" y="0" width="0" height="30">
      <animate attributeName="width" from="0" to="120" dur="0.9s" begin="0.4s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="cmd2"><rect x="0" y="0" width="0" height="30">
      <animate attributeName="width" from="0" to="235" dur="1.4s" begin="3.2s" fill="freeze"/>
    </rect></clipPath>
  </defs>
  <style>
    .ln { animation: lnIn .45s ease backwards; }
    @keyframes lnIn { from { opacity: 0; transform: translateY(6px); } }
    .focus { animation: lnIn .5s ease 4.8s backwards; }
    .cur { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    text { font: 14px 'Courier New', ui-monospace, monospace; }
  </style>

  <rect x="6" y="6" width="668" height="368" rx="14" fill="url(#termBg)" stroke="url(#asciiGrad)" stroke-opacity="0.5"/>
  <circle cx="30" cy="30" r="6" fill="#ff5f57"/>
  <circle cx="52" cy="30" r="6" fill="#febc2e"/>
  <circle cx="74" cy="30" r="6" fill="#28c840"/>
  <text x="340" y="35" text-anchor="middle" fill="#8b949e" font-size="12">sourav@github: ~</text>

  <text x="24" y="76" fill="#7ee787" xml:space="preserve">$ <tspan fill="#e6edf3" clip-path="url(#cmd1)">whoami</tspan></text>

  <g fill="url(#asciiGrad)" font-weight="bold">
    <text class="ln" style="animation-delay:1.5s" x="24" y="112" xml:space="preserve"> ____    ___   _   _   ____      _    __     __</text>
    <text class="ln" style="animation-delay:1.65s" x="24" y="132" xml:space="preserve">/ ___|  / _ \ | | | | |  _ \    / \   \ \   / /</text>
    <text class="ln" style="animation-delay:1.8s" x="24" y="152" xml:space="preserve">\___ \ | | | || | | | | |_) |  / _ \   \ \ / /</text>
    <text class="ln" style="animation-delay:1.95s" x="24" y="172" xml:space="preserve"> ___) || |_| || |_| | |  _ &lt;  / ___ \   \ V /</text>
    <text class="ln" style="animation-delay:2.1s" x="24" y="192" xml:space="preserve">|____/  \___/  \___/  |_| \_\/_/   \_\   \_/</text>
  </g>

  <text class="ln" style="animation-delay:2.6s" x="24" y="224" fill="#79c0ff" xml:space="preserve">AI Engineer &#183; Full-Stack Developer &#183; India</text>

  <text x="24" y="264" fill="#7ee787" xml:space="preserve">$ <tspan fill="#e6edf3" clip-path="url(#cmd2)">cat current_focus.txt</tspan></text>
  <text class="focus" x="24" y="296" fill="#e6edf3" xml:space="preserve">Academia LMS &#183; AI tools &#183; open source</text>

  <text x="24" y="336" fill="#7ee787" xml:space="preserve">$ <tspan class="cur" fill="#22d3ee">&#9608;</tspan></text>
</svg>
