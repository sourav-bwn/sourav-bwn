<svg xmlns="http://www.w3.org/2000/svg" width="660" height="56" viewBox="0 0 660 56" role="img" aria-label="Typing animation">
  <style>
    text { font: 600 20px 'Courier New', ui-monospace, monospace; }
    .t { fill: #c4b5fd; }
